name: Validate and package plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and build the plugin ZIP
        run: python scripts/package_plugin.py
      - uses: actions/upload-artifact@v4
        with:
          name: tsgh-clinical-notes-plugin
          path: dist/*.zip
          if-no-files-found: error
